<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оптимизационные геометрические задачи</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2933;--mute:#6b7785;--line:#dfe3e8;--g:#3f9b4a;--gl:#e4f3e6;--r:#c0392b;--rl:#fbe7e4;--b:#2f6fb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1e2328;--ink:#e6e9ec;--mute:#98a2ad;--line:#2f363d;--g:#5fbf6b;--gl:#1f3324;--r:#ef7b6e;--rl:#3a1f1c;--b:#7db4ee}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
.note{margin-left:auto;font-size:13px;color:var(--mute);background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:6px}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:0;max-width:1200px;margin:0 auto}
nav{padding:16px;border-right:1px solid var(--line);background:var(--card);min-height:calc(100vh - 62px)}
nav h2{font-size:14px;margin:0 0 10px;color:var(--mute);font-weight:600}
.mod{margin-bottom:6px}
.mod>button{width:100%;text-align:left;background:none;border:0;padding:8px 6px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;border-radius:6px}
.mod>button:hover{background:var(--bg)}
.mod ul{list-style:none;margin:0 0 6px;padding:0 0 0 12px}
.mod li button{width:100%;text-align:left;background:none;border:0;padding:6px 8px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;border-radius:6px;border-left:3px solid transparent}
.mod li button:hover{background:var(--bg)}
.mod li button.on{background:var(--gl);border-left-color:var(--g);font-weight:600}
.mod>button small{display:block;color:var(--mute);font-size:12px;font-weight:400}.grp{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}.gl{min-width:170px;font-size:13px;color:var(--mute);font-weight:600}.mod li small{display:block;color:var(--mute);font-size:12px}
main{padding:20px 24px 40px;min-width:0}
.crumb{font-size:13px;color:var(--mute);margin-bottom:6px}
main h2{margin:0 0 12px;font-size:22px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{width:38px;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;font-weight:600;color:var(--ink)}
.steps button.on{outline:2px solid var(--b);outline-offset:1px}
.steps button.ok{background:var(--g);border-color:var(--g);color:#fff}
.steps button.dn{background:var(--bg);border-color:var(--b)}.steps button.bad{background:var(--rl);border-color:var(--r)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.tag{display:inline-block;font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 8px;margin-bottom:10px}
.def{border-left:4px solid var(--b);background:var(--bg);padding:10px 14px;margin:12px 0;border-radius:0 6px 6px 0}
.f{text-align:center;font-family:Cambria,"Times New Roman",serif;font-size:18px;margin:12px 0;font-style:italic}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--b)}.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.opt.sel{border-color:var(--b);background:var(--bg)}
.opt.right{border-color:var(--g);background:var(--gl)}
.opt.wrong{border-color:var(--r);background:var(--rl)}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:140px;background:var(--card);color:var(--ink)}
.fb{margin-top:12px;padding:10px 14px;border-radius:8px;display:none}
.fb.ok{display:block;background:var(--gl);color:var(--ink)}
.fb.bad{display:block;background:var(--rl);color:var(--ink)}.fb.info{display:block;background:var(--bg);border:1px solid var(--line)}[hidden]{display:none!important}ol{padding-left:22px}
.nav2{display:flex;justify-content:space-between;margin-top:16px}
.video{aspect-ratio:16/8;background:#222;color:#ddd;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.video span{font-size:42px}
.st{display:flex;gap:10px;margin:8px 0}.st>b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;text-align:center;line-height:26px;font-size:14px}.sol{border-left:4px solid var(--g);background:var(--gl);padding:6px 14px;margin:12px 0;border-radius:0 6px 6px 0}h3{margin:18px 0 6px;font-size:17px}.art{line-height:1.7}.art p{margin:8px 0}.art h3{margin:22px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}.art h3:first-child{margin-top:0}.art ul,.art ol{margin:8px 0;padding-left:24px}.art li{margin:4px 0}.art table{margin:10px 0}.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.2;font-size:.95em;font-style:normal}.fr>.n{border-bottom:1.5px solid currentColor;padding:0 4px}.fr>.d{padding:0 4px}.fig{display:block;margin:10px auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.ph{color:var(--mute);text-align:center;padding:30px 10px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}nav{min-height:0;border-right:0;border-bottom:1px solid var(--line)}.note{margin-left:0}}
</style>
</head>
<body>
<header><h1>Оптимизационные геометрические задачи</h1><span class="note">Курс для 10–11 классов: 4 модуля, 9 уроков</span></header>
<div class="wrap">
<nav id="nav" aria-label="Программа курса"><h2>Программа курса</h2></nav>
<main id="main"></main>
</div>
<script>
const box=`<svg class="fig" width="240" height="150" viewBox="0 0 240 150" role="img" aria-label="Квадратный лист с вырезанными углами"><rect x="20" y="10" width="120" height="120" fill="none" stroke="currentColor"/><g fill="#9aa5b1" stroke="currentColor"><rect x="20" y="10" width="30" height="30"/><rect x="110" y="10" width="30" height="30"/><rect x="20" y="100" width="30" height="30"/><rect x="110" y="100" width="30" height="30"/></g><text x="28" y="146" font-size="12" fill="currentColor">x</text><text x="68" y="146" font-size="12" fill="currentColor">24 − 2x</text><text x="150" y="75" font-size="12" fill="currentColor">сторона листа 24 см</text></svg>`;
const T=(t)=>({type:'text',tag:'Теория',html:'<div class="art">'+t+'</div>'});const FM=t=>`<div class="f">${t}</div>`;
const E=(t)=>({type:'text',tag:'Разбор задачи',html:'<div class="art">'+t+'</div>'});
const Q=(q,opts,ok,why,lv=1)=>({type:'quiz',tag:'Уровень '+lv+': тест',q,opts,ok,why});
const N=(q,ans,why,lv=1)=>({type:'num',tag:lv==='c'?'Самостоятельная работа':'Уровень '+lv+': числовая задача',q,ans,why,self:lv==='c'});
const D=(n,t)=>`<div class="def"><b>${n}.</b> ${t}</div>`;
const ALG=`<ol><li>Сделать чертёж, выписать «дано» и «найти».</li><li>Выбрать переменную x и выразить через неё остальные величины.</li><li>Составить функцию f(x) для искомой величины и найти допустимые значения x (ОДЗ).</li><li>Найти f′(x), решить f′(x) = 0, оставить критические точки из ОДЗ.</li><li>Найти наибольшее (наименьшее) значение: на отрезке сравнить значения (теорема 4), на интервале использовать знак производной и единственную критическую точку (теоремы 3 и 5).</li><li>Проверить результат и ответить на вопрос задачи.</li></ol>`;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const st6=(n,t)=>`<div class="st"><b>${n}</b><div>${t}</div></div>`;
const plot=(f,a,b,ym,mx,lab)=>{const W=300,H=150,pl=34,pb=24,pts=[];for(let i=0;i<=60;i++){const x=a+(b-a)*i/60;pts.push((pl+(W-pl-8)*(x-a)/(b-a)).toFixed(1)+','+(H-pb-(H-pb-10)*f(x)/ym).toFixed(1))}
 const X=(pl+(W-pl-8)*(mx-a)/(b-a)).toFixed(1),Y=(H-pb-(H-pb-10)*f(mx)/ym).toFixed(1);
 return `<svg class="fig" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${lab}"><path d="M${pts.join(' L')}" fill="none" stroke="currentColor" stroke-width="2"/><line x1="${pl}" y1="${H-pb}" x2="${W-6}" y2="${H-pb}" stroke="currentColor"/><line x1="${pl}" y1="6" x2="${pl}" y2="${H-pb}" stroke="currentColor"/><line x1="${X}" y1="${Y}" x2="${X}" y2="${H-pb}" stroke="currentColor" stroke-dasharray="3 3"/><circle cx="${X}" cy="${Y}" r="4" fill="currentColor"/><text x="${X}" y="${H-8}" font-size="12" text-anchor="middle" fill="currentColor">${mx}</text><text x="${+X+8}" y="${+Y-6}" font-size="12" fill="currentColor">max = ${f(mx)}</text></svg><p style="text-align:center;font-size:13px;color:var(--mute);margin:0">${lab}</p>`};
const signs=`<svg class="fig" width="320" height="86" viewBox="0 0 320 86" role="img" aria-label="Знаки производной"><line x1="20" y1="50" x2="305" y2="50" stroke="currentColor" stroke-width="2"/><g stroke="currentColor"><line x1="30" y1="44" x2="30" y2="56"/><line x1="117" y1="44" x2="117" y2="56"/><line x1="290" y1="44" x2="290" y2="56"/></g><g font-size="13" fill="currentColor" text-anchor="middle"><text x="30" y="72">0</text><text x="117" y="72">4</text><text x="290" y="72">12</text><text x="73" y="38" font-size="18">+</text><text x="203" y="38" font-size="18">−</text><text x="73" y="18">V возрастает</text><text x="203" y="18">V убывает</text></g><circle cx="117" cy="50" r="4" fill="currentColor"/></svg>`;
const sv=(w,h,a,b)=>`<svg class="fig" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${a}" fill="none" stroke="currentColor" stroke-width="2">${b}</svg>`;
const tx=(x,y,t,a='middle')=>`<text x="${x}" y="${y}" font-size="14" text-anchor="${a}" fill="currentColor" stroke="none">${t}</text>`;
const figRect=sv(300,140,'Прямоугольник со сторонами x и 10 − x',`<rect x="50" y="20" width="190" height="85"/>${tx(145,125,'x')}${tx(268,68,'10 − x')}`);
const boxFold=sv(300,165,'Коробка без крышки',`<path d="M40 70 H150 V125 H40 Z"/><path d="M40 70 L75 42 H185 L150 70"/><path d="M185 42 V97 L150 125"/><path d="M75 42 V97 L40 125 M75 97 H185" stroke-dasharray="4 4" stroke-width="1.5"/>${tx(95,148,'24 − 2x')}${tx(30,102,'x','end')}${tx(230,150,'коробка без крышки')}`);
const figRiver=sv(320,165,'Участок у реки',`<path d="M10 138 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t30 0" stroke-width="1.5"/><path d="M60 125 V30 H260 V125" stroke-width="4"/>${tx(160,20,'100 − 2x')}${tx(40,80,'x')}${tx(282,80,'x')}${tx(160,158,'река (вдоль реки забор не нужен)')}`);
const figTri=sv(300,165,'Прямоугольный треугольник с гипотенузой 10',`<path d="M100 130 H280 L100 30 Z"/><path d="M118 130 V112 H100" stroke-width="1.5"/>${tx(190,152,'x')}${tx(92,86,'√(100 − x²)','end')}${tx(205,72,'10','start')}`);
const figCyl=sv(300,170,'Цилиндрический бак без крышки',`<ellipse cx="110" cy="35" rx="60" ry="16"/><path d="M50 35 V125 A60 16 0 0 0 170 125 V35"/><path d="M50 125 A60 16 0 0 1 170 125" stroke-dasharray="4 4" stroke-width="1.5"/><path d="M110 35 H170" stroke-width="3"/>${tx(178,31,'r','start')}<path d="M200 35 V125 M194 35 H206 M194 125 H206" stroke-width="1.5"/>${tx(214,85,'h','start')}${tx(110,163,'бак без крышки')}`);
const figCone=sv(300,175,'Конус, вписанный в шар',`<circle cx="130" cy="88" r="70"/><path d="M130 18 L64 111 H196 Z" stroke-width="3"/><path d="M130 18 V111" stroke-dasharray="4 4" stroke-width="1.5"/><path d="M130 88 H200" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="130" cy="88" r="3" fill="currentColor"/>${tx(122,66,'h','end')}${tx(165,128,'r')}${tx(166,81,'R')}${tx(130,172,'осевое сечение')}`);
const course=[
{m:'Модуль 1. Повторение: производная и экстремумы',l:[
 {t:'Производная и критические точки',s:[
  T(`<h3>1. Производная и её смысл</h3>
<p>Производная показывает, как быстро меняется функция в данной точке.</p>
${D('Определение 1','Производной функции f(x) в точке x₀ называется предел отношения приращения функции к приращению аргумента при h → 0.')}
${FM('f′(x₀) = lim<sub>h→0</sub> '+fr('f(x₀ + h) − f(x₀)','h'))}
<p>Геометрически f′(x₀) – это угловой коэффициент касательной к графику в точке x₀. Касательная идёт вверх – производная положительна, вниз – отрицательна, горизонтальна – равна нулю.</p>
<h3>2. Знак производной</h3>
<p>По знаку производной видно, растёт функция или убывает.</p>
${D('Теорема 1','Если f′(x) &gt; 0 на промежутке, то функция на нём возрастает. Если f′(x) &lt; 0, то функция на нём убывает.')}
<h3>3. Экстремумы</h3>
<p>Точка, где возрастание сменяется убыванием, – вершина «горки». Точка, где убывание сменяется возрастанием, – дно «ямы».</p>
${D('Определение 2','Точка x₀ называется точкой максимума, если в некоторой её окрестности f(x) &lt; f(x₀) при x ≠ x₀, и точкой минимума, если f(x) &gt; f(x₀). Максимумы и минимумы называют экстремумами.')}
${D('Теорема 2 (Ферма)','Если x₀ – точка экстремума и в ней существует производная, то f′(x₀) = 0.')}
<p>Обратное неверно: у функции y = x³ производная в точке 0 равна нулю, но экстремума нет – функция там просто возрастает.</p>
<h3>4. Критические точки</h3>
<p>Теорема Ферма сужает поиск: экстремум нужно искать только там, где производная равна нулю или не существует.</p>
${D('Определение 3','Критическими точками называются внутренние точки области определения, в которых производная равна нулю или не существует.')}
${D('Теорема 3 (достаточное условие экстремума)','Если при переходе через критическую точку производная меняет знак с «+» на «−», это точка максимума. Если с «−» на «+», это точка минимума.')}
<h3>5. Как найти экстремум</h3>
<ol><li>Найдите f′(x).</li><li>Решите уравнение f′(x) = 0 – получите критические точки.</li><li>Определите знак f′(x) слева и справа от каждой точки.</li><li>Сделайте вывод по теореме 3.</li></ol>
<h3>Пример</h3>
<p><b>Задача.</b> Найдите точку минимума функции f(x) = x² − 10x + 3.</p>
<div class="sol">${st6(1,'f′(x) = 2x − 10.')}${st6(2,'2x − 10 = 0, откуда x = 5 – критическая точка.')}${st6(3,'При x = 0: f′(0) = −10 &lt; 0. При x = 6: f′(6) = 2 &gt; 0. Знак меняется с «−» на «+».')}${st6(4,'По теореме 3 это точка минимума. <b>Ответ:</b> x = 5.')}</div>`),
  Q('Найдите критическую точку функции f(x) = x² − 6x + 5.',['x = 3','x = 5','x = −3','Критических точек нет'],0,'f′(x) = 2x − 6 = 0, значит x = 3.'),
  Q('Производная меняет знак с «−» на «+» в точке x₀. Что это за точка?',['Точка минимума','Точка максимума','Экстремума нет','Нельзя определить'],0,'По теореме 3 это точка минимума.'),
  N('Найдите f′(2) для f(x) = x³ − 4x.','8','f′(x) = 3x² − 4, f′(2) = 12 − 4 = 8.',2),
  N('Найдите точку минимума функции f(x) = x² − 8x + 3.','4','f′(x) = 2x − 8 = 0, x = 4; знак меняется с «−» на «+».','c'),
  N('Найдите точку максимума функции f(x) = −x³ + 3x.','1','f′(x) = −3x² + 3 = 0, x = ±1. Знак меняется с «+» на «−» в точке x = 1.','c')]},
 {t:'Наибольшее и наименьшее значения',s:[
  T(`<h3>1. Какую задачу решаем</h3>
<p>Экстремум – это наибольшее значение функции только рядом с точкой. В задачах нужно наибольшее и наименьшее значения на всём заданном промежутке. Различают два случая: отрезок и интервал.</p>
<h3>2. Случай отрезка</h3>
${D('Теорема 4 (Вейерштрасса)','Если функция непрерывна на отрезке [a; b], то она принимает на нём своё наибольшее и своё наименьшее значения.')}
<p>По теореме 2 внутри отрезка наибольшее значение может быть только в критической точке, иначе оно на конце отрезка. Отсюда правило:</p>
<ol><li>найдите критические точки внутри отрезка;</li><li>вычислите значения функции в них и на концах отрезка;</li><li>выберите наибольшее и наименьшее из полученных чисел.</li></ol>
<h3>Пример 1 (отрезок)</h3>
<p><b>Задача.</b> Найдите наибольшее и наименьшее значения f(x) = x² − 6x на отрезке [0; 5].</p>
<div class="sol">${st6(1,'f′(x) = 2x − 6 = 0, x = 3 – критическая точка, она лежит внутри отрезка.')}${st6(2,'f(0) = 0, f(3) = −9, f(5) = −5.')}${st6(3,'<b>Ответ:</b> наибольшее значение 0, наименьшее −9.')}</div>
<h3>3. Случай интервала</h3>
<p>В геометрических задачах длины положительны, поэтому допустимые значения образуют интервал, например (0; 12). У интервала нет концов, поэтому сравнивать значения на концах нельзя.</p>
${D('Теорема 5','Если функция непрерывна на интервале и имеет на нём единственную критическую точку, являющуюся точкой максимума (минимума), то в ней достигается наибольшее (наименьшее) значение на этом интервале.')}
<p>Значит, достаточно найти единственную критическую точку и проверить знак производной по теореме 3.</p>
<h3>Пример 2 (интервал)</h3>
<p><b>Задача.</b> Найдите наименьшее значение f(x) = x + ${fr(1,'x')} на интервале (0; +∞).</p>
<div class="sol">${st6(1,'f′(x) = 1 − '+fr(1,'x²')+' = 0, откуда x² = 1. В интервал входит только x = 1.')}${st6(2,'f′(0,5) = 1 − 4 = −3 &lt; 0, f′(2) = 1 − '+fr(1,4)+' &gt; 0. Знак меняется с «−» на «+» – минимум.')}${st6(3,'Точка единственная, значит по теореме 5 это наименьшее значение. <b>Ответ:</b> f(1) = 2.')}</div>`),
  N('Найдите наибольшее значение f(x) = x² − 4x на отрезке [0; 5].','5','f(0) = 0, f(2) = −4, f(5) = 5. Наибольшее – 5.'),
  N('Найдите наименьшее значение f(x) = x³ − 12x на отрезке [0; 3].','-16','f′ = 3x² − 12 = 0, x = 2. f(0) = 0, f(2) = −16, f(3) = −9.',2),
  N('Найдите наибольшее значение f(x) = 2x³ − 3x² − 12x + 1 на отрезке [−2; 3].','8','f′ = 6(x² − x − 2) = 0, x = −1 и x = 2. f(−2) = −3, f(−1) = 8, f(2) = −19, f(3) = −8.','c'),
  N('Найдите наименьшее значение f(x) = x + 4/x на интервале (0; +∞).','4','f′ = 1 − 4/x² = 0, x = 2 – единственная критическая точка, минимум. f(2) = 4 (теорема 5).','c')]}]},
{m:'Модуль 2. Алгоритм решения',l:[
 {t:'Шесть шагов на примере коробки',s:[
  T(`<p>Любая задача «найти наибольшее или наименьшее» решается одинаково: <b>условие превращаем в функцию одной переменной</b>, а затем находим её наибольшее или наименьшее значение с помощью производной (теоремы 1–5 из модуля 1). Для этого есть шесть шагов.</p>
${st6(1,'<b>Чертёж.</b> Нарисуйте фигуру, подпишите известные величины. Запишите, что дано и что нужно сделать наибольшим или наименьшим.')}
${st6(2,'<b>Переменная.</b> Обозначьте буквой x величину, которую можно менять (сторона, радиус, высота). Остальные величины выразите через x с помощью условия: периметра, объёма, теоремы Пифагора.')}
${st6(3,'<b>Функция и ОДЗ.</b> Запишите искомую величину (площадь, объём, длину) формулой от x. Найдите ОДЗ: длины положительны. Отметьте, чем является ОДЗ: отрезком или интервалом.')}
${st6(4,'<b>Производная.</b> Найдите f′(x) и решите уравнение f′(x) = 0. Оставьте только корни из ОДЗ – это критические точки.')}
${st6(5,'<b>Наибольшее или наименьшее.</b> Если ОДЗ – отрезок: сравните значения функции на концах и в критических точках (теорема 4). Если интервал: посмотрите на знак f′(x). Смена «+» на «−» – максимум, и он единственный, значит это наибольшее значение; смена «−» на «+» – минимум, наименьшее значение (теоремы 3 и 5).')}
${st6(6,'<b>Ответ.</b> Вернитесь к вопросу: просили найти x или значение величины? Проверьте, что x входит в ОДЗ, и запишите единицы измерения.')}
<div class="def"><b>Частые ошибки.</b> Забыть про ОДЗ; ответить x, когда спрашивали площадь или объём; на отрезке не проверить концы.</div>
<h3>Лёгкий пример по этой теории</h3>
<p><b>Задача.</b> Периметр прямоугольника равен 20 см. Какими должны быть стороны, чтобы площадь была наибольшей?</p>${figRect}
<div class="sol">
${st6(1,'Дано: P = 20 см. Найти: стороны, при которых площадь S наибольшая.')}
${st6(2,'Пусть одна сторона x. Так как 2(x + y) = 20, другая сторона равна 10 − x.')}
${st6(3,'S(x) = x(10 − x) = 10x − x². ОДЗ: обе стороны положительны, значит 0 &lt; x &lt; 10 – интервал.')}
${st6(4,'S′(x) = 10 − 2x = 0, откуда x = 5. Это число входит в ОДЗ, значит x = 5 – критическая точка.')}
${st6(5,'При x &lt; 5 производная положительна, при x &gt; 5 отрицательна: знак меняется с «+» на «−». Это единственный максимум, значит S(5) = 5 · 5 = 25 – наибольшее значение (теорема 5).')}
${st6(6,'Ответ: стороны 5 см и 5 см (квадрат), наибольшая площадь 25 см².')}
</div>
${plot(x=>x*(10-x),0,10,25,5,'График S(x) = x(10 − x)')}`),
  E(`<p><b>Задача.</b> Из квадратного листа картона со стороной 24 см по углам вырезают одинаковые квадраты со стороной x и сгибают края, получая коробку без крышки. При каком x объём коробки наибольший?</p>${box}
<div class="sol">
${st6(1,'<b>Чертёж.</b> Лист 24 × 24 см, в каждом углу вырезан квадрат x × x (на рисунке закрашены). Оставшиеся края сгибаем вверх. Дано: сторона листа 24 см. Найти: x, при котором объём коробки наибольший.')}
${st6(2,'<b>Переменная.</b> Пусть x – сторона вырезаемого квадрата. Она же станет высотой коробки. С каждой стороны листа убрано по x с двух краёв, поэтому сторона дна равна 24 − 2x.')}
${st6(3,'<b>Функция и ОДЗ.</b> Объём равен площади дна, умноженной на высоту: V(x) = (24 − 2x)² · x. Высота положительна (x &gt; 0) и сторона дна положительна (24 − 2x &gt; 0, то есть x &lt; 12). Значит, ОДЗ: 0 &lt; x &lt; 12 – это интервал, поэтому на шаге 5 будем использовать теорему 5.')}
</div><p>Шаги 4–6 – на следующем экране.</p>`),
  E(`<p>Продолжаем: V(x) = x(24 − 2x)², ОДЗ 0 &lt; x &lt; 12.</p>${boxFold}
<div class="sol">
${st6(4,'<b>Производная.</b> По правилу производной произведения: V′(x) = (24 − 2x)² + x · 2(24 − 2x) · (−2) = (24 − 2x)·[(24 − 2x) − 4x] = (24 − 2x)(24 − 6x). Приравниваем к нулю: 24 − 2x = 0 даёт x = 12, а 24 − 6x = 0 даёт x = 4. Значение x = 12 не входит в ОДЗ (при нём коробка не получается), значит единственная критическая точка – x = 4.')}
${st6(5,'<b>Наибольшее значение.</b> Проверим знак V′. При x = 1: V′(1) = 22 · 18 &gt; 0. При x = 6: V′(6) = 12 · (−12) &lt; 0. Знак меняется с «+» на «−», значит x = 4 – точка максимума (теорема 3), а так как она единственная на интервале, в ней объём наибольший (теорема 5). V(4) = 4 · (24 − 8)² = 4 · 256 = 1024.')}
${st6(6,'<b>Ответ.</b> x = 4 см, наибольший объём 1024 см³. Проверка: 4 входит в (0; 12); дно 16 × 16 см, высота 4 см, объём 16 · 16 · 4 = 1024 см³.')}
</div>${signs}${plot(x=>x*(24-2*x)**2,0,12,1100,4,'График V(x) = x(24 − 2x)²')}`),
  Q('Тренируемся на листе 18 × 18 см. Шаг 3: какая функция описывает объём коробки?',['V(x) = x(18 − 2x)²','V(x) = x(18 − x)²','V(x) = 18x²','V(x) = (18 − 2x)²'],0,'Высота x, сторона дна 18 − 2x, значит V = x(18 − 2x)².'),
  Q('Шаг 3. Каковы допустимые значения x (ОДЗ) для листа 18 × 18?',['0 < x < 9','0 < x < 18','x > 0','−9 < x < 9'],0,'Сторона дна 18 − 2x положительна, значит x < 9.'),
  N('Шаг 4. Найдите критическую точку из ОДЗ: V′(x) = (18 − 2x)(18 − 6x) = 0.','3','Корни 9 и 3, в ОДЗ входит только 3.'),
  Q('Шаг 5. Почему в точке x = 3 объём наибольший?',['Единственная критическая точка, это максимум (теоремы 3 и 5)','Потому что 3 – целое число','Потому что V(3) &gt; 0','Потому что V′(3) &gt; 0'],0,'На (0; 3) V′ &gt; 0, на (3; 9) V′ &lt; 0, точка единственная.'),
  N('Шаг 6. Чему равен наибольший объём коробки из листа 18 × 18 (см³)?','432','V(3) = 3 · 12² = 432.'),
  N('Квадратный лист со стороной 12 см, углы вырезают так же. Найдите наибольший объём коробки (см³).','128','V = x(12 − 2x)², V′ = (12 − 2x)(12 − 6x) = 0, x = 2 (x = 6 не входит в ОДЗ). V(2) = 2 · 64 = 128.','c')]}]},
{m:'Модуль 3. Планиметрические задачи',l:[
 {t:'Прямоугольник',s:[
  T(`<h3>1. Идея</h3>
<p>Если для прямоугольника задано условие (периметр, площадь, длина забора), одна сторона выражается через другую. Тогда площадь или периметр становятся функцией одной переменной x.</p>
<h3>2. Основные случаи</h3>
<table><thead><tr><th>Условие</th><th>Вторая сторона</th><th>Функция</th></tr></thead><tbody>
<tr><td>Задан периметр P</td><td>${fr('P',2)} − x</td><td>S(x) = x(${fr('P',2)} − x)</td></tr>
<tr><td>Задана площадь S</td><td>${fr('S','x')}</td><td>P(x) = 2(x + ${fr('S','x')})</td></tr>
<tr><td>Забор длиной L с трёх сторон (у стены)</td><td>L − 2x</td><td>S(x) = x(L − 2x)</td></tr>
<tr><td>Вписан в окружность радиуса R</td><td>√(4R² − x²)</td><td>S(x) = x√(4R² − x²)</td></tr></tbody></table>
<h3>3. Что делать дальше</h3>
<p>Стороны положительны, поэтому ОДЗ – интервал. Применяем теорему 5: находим единственную критическую точку и проверяем смену знака производной.</p>`),
  E(`<p><b>Задача.</b> Участок у реки огораживают забором длиной 100 м с трёх сторон (река – четвёртая сторона). Найдите наибольшую площадь участка.</p>${figRiver}
<div class="sol">${st6(1,'<b>Чертёж.</b> Прямоугольник, одна сторона лежит вдоль реки и не огораживается. Дано: L = 100 м. Найти: наибольшую площадь S.')}${st6(2,'<b>Переменная.</b> Пусть x – каждая из двух сторон, перпендикулярных реке. Сторона вдоль реки равна 100 − 2x.')}${st6(3,'<b>Функция и ОДЗ.</b> S(x) = x(100 − 2x) = 100x − 2x². Условия x &gt; 0 и 100 − 2x &gt; 0 дают ОДЗ 0 &lt; x &lt; 50 – интервал.')}${st6(4,'<b>Производная.</b> S′(x) = 100 − 4x = 0, откуда x = 25. Это число входит в ОДЗ.')}${st6(5,'<b>Наибольшее значение.</b> При x &lt; 25 производная положительна, при x &gt; 25 отрицательна: знак меняется с «+» на «−». Максимум единственный (теоремы 3 и 5), значит S(25) = 25 · 50 = 1250.')}${st6(6,'<b>Ответ.</b> Наибольшая площадь 1250 м² при сторонах 25 м и 50 м.')}</div>`),
  N('Периметр прямоугольника 60 см. Найдите наибольшую площадь (см²).','225','S = x(30 − x), x = 15, S = 225.'),
  N('Площадь прямоугольника 100 м². Найдите наименьший периметр (м).','40','P = 2(x + 100/x), P′ = 2(1 − 100/x²) = 0, x = 10, P = 40.',2),
  N('Участок у стены огораживают забором длиной 80 м с трёх сторон (стена – четвёртая сторона). Найдите наибольшую площадь (м²).','800','Стороны x, x и 80 − 2x. S = x(80 − 2x), S′ = 80 − 4x = 0, x = 20, S = 20 · 40 = 800.','c')]},
 {t:'Треугольник и расстояния',s:[
  T(`<h3>1. Расстояние между точками</h3>
<p>Расстояние между точками (x₁; y₁) и (x₂; y₂) равно</p>
${FM('d = √((x₂ − x₁)² + (y₂ − y₁)²)')}
<p>Корень неудобен при вычислении производной. Но d &gt; 0, поэтому наименьшее d получается там же, где наименьшее d². Ищем минимум d².</p>
<h3>2. Площадь прямоугольного треугольника</h3>
<p>Если катеты a и b, а гипотенуза c, то</p>
${FM('S = '+fr('ab',2)+', a² + b² = c²')}
<p>При заданной c второй катет b = √(c² − a²). Максимум S совпадает с максимумом S², а в S² корня нет.</p>
<h3>3. Площадь через угол</h3>
${FM('S = '+fr(1,2)+' ab sin α')}
<p>Если стороны a и b заданы, площадь зависит только от угла α и наибольшая при sin α = 1, то есть при α = 90°.</p>
<h3>Общее правило</h3>
<p>Если в целевой функции есть корень, возведите её в квадрат: экстремум не изменится, а производная станет проще.</p>`),
  E(`<p><b>Задача.</b> Гипотенуза прямоугольного треугольника равна 10. Найдите наибольшую площадь треугольника.</p>${figTri}
<div class="sol">${st6(1,'<b>Чертёж.</b> Прямоугольный треугольник, c = 10. Найти: наибольшую площадь S.')}${st6(2,'<b>Переменная.</b> Пусть один катет равен x, тогда другой равен √(100 − x²).')}${st6(3,'<b>Функция и ОДЗ.</b> S = '+fr(1,2)+' x √(100 − x²), 0 &lt; x &lt; 10. Берём квадрат: g(x) = S² = '+fr('x²(100 − x²)',4)+' = '+fr('100x² − x⁴',4)+'.')}${st6(4,'<b>Производная.</b> g′(x) = '+fr('200x − 4x³',4)+' = x(50 − x²) = 0. В ОДЗ входит только x = √50.')}${st6(5,'<b>Наибольшее значение.</b> При x &lt; √50 имеем g′ &gt; 0, при x &gt; √50 имеем g′ &lt; 0: максимум единственный (теоремы 3 и 5). Тогда S = '+fr(1,2)+' · √50 · √50 = 25.')}${st6(6,'<b>Ответ.</b> Наибольшая площадь 25 (катеты равны 5√2, треугольник равнобедренный).')}</div>`),
  Q('Точка M(x; x²) лежит на параболе, A(0; 2). Чему равен квадрат расстояния AM?',['x² + (x² − 2)²','x² + (x − 2)²','(x² − 2)²','x + (x² − 2)'],0,'Разность абсцисс x, ординат x² − 2.'),
  N('Гипотенуза прямоугольного треугольника равна 14. Найдите наибольшую площадь.','49','x² = 98, S = ½ · 98 = 49.',2),
  N('Найдите наименьший квадрат расстояния от точки (0; 2) до параболы y = x².','1.75','d² = x⁴ − 3x² + 4, (d²)′ = 4x³ − 6x = 0, x² = 1,5. d² = 2,25 − 4,5 + 4 = 1,75. Можно ввести 7/4.','c')]}]},
{m:'Модуль 4. Стереометрические задачи',l:[
 {t:'Цилиндр и параллелепипед',s:[
  T(`<h3>1. Формулы цилиндра</h3>
<ul><li>объём V = πr²h;</li><li>площадь основания πr²;</li><li>боковая поверхность 2πrh;</li><li>полная поверхность S = 2πr² + 2πrh;</li><li>поверхность без крышки S = πr² + 2πrh.</li></ul>
<h3>2. Как свести задачу к одной переменной</h3>
<p>В задачах задан объём V. Выразите высоту через радиус:</p>
${FM('h = '+fr('V','πr²'))}
<p>и подставьте в формулу площади поверхности. Получится функция S(r), ОДЗ которой r &gt; 0.</p>
<h3>3. Ящик с квадратным основанием</h3>
<ul><li>объём V = a²h, поэтому h = ${fr('V','a²')};</li><li>закрытый ящик: S = 2a² + 4ah;</li><li>ящик без крышки: S = a² + 4ah.</li></ul>`),
  E(`<p><b>Задача.</b> Открытый (без крышки) цилиндрический бак имеет объём 27π дм³. При каком радиусе r площадь поверхности наименьшая?</p>${figCyl}
<div class="sol">${st6(1,'<b>Чертёж.</b> Цилиндр без верхнего основания. Дано: V = 27π дм³. Найти: r, при котором S наименьшая.')}${st6(2,'<b>Переменная.</b> Пусть r – радиус основания. Из V = πr²h получаем h = '+fr(27,'r²')+'.')}${st6(3,'<b>Функция и ОДЗ.</b> S(r) = πr² + 2πr · '+fr(27,'r²')+' = πr² + '+fr('54π','r')+', ОДЗ r &gt; 0 (интервал).')}${st6(4,'<b>Производная.</b> S′(r) = π(2r − '+fr(54,'r²')+') = 0, откуда r³ = 27 и r = 3.')}${st6(5,'<b>Наименьшее значение.</b> При r = 1 имеем 2 − 54 &lt; 0, при r = 4 имеем 8 − '+fr(54,16)+' &gt; 0: знак меняется с «−» на «+». Минимум единственный (теоремы 3 и 5).')}${st6(6,'<b>Ответ.</b> r = 3 дм, при этом h = '+fr(27,9)+' = 3 дм.')}</div>`),
  N('Открытый цилиндрический бак объёмом 64π дм³. Найдите радиус, при котором площадь поверхности наименьшая.','4','h = 64/r², S = πr² + 128π/r, S′ = π(2r − 128/r²) = 0, r³ = 64, r = 4.',2),
  N('Закрытая банка объёмом 54π см³. Найдите высоту, при которой площадь поверхности наименьшая.','6','h = 54/r², S = 2πr² + 108π/r, S′ = π(4r − 108/r²) = 0, r = 3, h = 54/9 = 6.','c'),
  N('Параллелепипед с квадратным основанием и объёмом 64 см³. Найдите сторону основания при наименьшей площади поверхности.','4','h = 64/a², S = 2a² + 256/a, S′ = 4a − 256/a² = 0, a³ = 64, a = 4.','c')]},
 {t:'Конус и шар',s:[
  T(`<h3>1. Объём конуса</h3>
${FM('V = '+fr('πr²h',3))}
<p>где r – радиус основания, h – высота конуса.</p>
<h3>2. Конус, вписанный в шар</h3>
<p>Вершина конуса и окружность основания лежат на шаре радиуса R. Осевое сечение – треугольник, вписанный в окружность радиуса R. Высота h делит диаметр шара на отрезки h и 2R − h, поэтому по теореме о пересекающихся хордах</p>
${FM('r² = h(2R − h)')}
<h3>3. Объём как функция высоты</h3>
<p>Подставим r² в формулу объёма:</p>
${FM('V(h) = '+fr('π(2Rh² − h³)',3)+', 0 &lt; h &lt; 2R')}
<p>Это функция одной переменной h, к ней применяем алгоритм из модуля 2.</p>`),
  E(`<p><b>Задача.</b> В шар радиуса 21 вписан конус. При какой высоте объём конуса наибольший?</p>${figCone}

 [...T1([27,64,125,216,343,512].map(b41)),...[2,3,4,5,6,7].map(o41),...SELF([...[2,3,4,5].map(s41),...[2,3,4,5,6].map(c41),...[4,32,108,256,500,864].map(e41)])],
 [...T1([3,6,9,12,15,18].map(R=>h42(R,1))),...[3,6,9,12,15,18].map(R=>r42(R,2)),...SELF([...[9,18,27,36,45].map(v42),...[21,24,27,30,33].map(R=>h42(R,'c')),...[21,24,27,30,33].map(R=>r42(R,'c'))])]];
let gi=0;
const lessons=[];course.forEach((c,mi)=>c.l.forEach((l,li)=>{l.s=l.s.filter(x=>x.type==='text').concat(GEN[gi++]);l.s.forEach(sh);const s=[...l.s].sort((a,b)=>gr(a)-gr(b));lessons.push({...l,s,mi,li,done:s.map(()=>0),att:[],wr:[]})}));
const total=lessons.reduce((a,l)=>a+l.s.length,0);document.querySelector('.note').textContent='Курс для 10–11 классов: 4 модуля, '+lessons.length+' уроков, '+total+' заданий';
let cur=0,st=0,openM=0;const tk=l=>l.s.map((x,i)=>x.type==='quiz'||x.type==='num'?i:-1).filter(i=>i>=0);const cnt=l=>{const t=tk(l),a=t.filter(i=>l.done[i]>0).length;return[a,a,t.length]};const cls=(L,i)=>L.done[i]==1?'ok':L.done[i]==2?'bad':L.done[i]==3?(L.fin?(L.corr[i]?'ok':'bad'):'dn'):'';const pf=s=>String(s).split('/').map(Number).reduce((a,b)=>a/b);
const nav=document.getElementById('nav'),main=document.getElementById('main');
function drawNav(){
 nav.innerHTML='<h2>Программа курса</h2>';
 course.forEach((c,mi)=>{const d=document.createElement('div');d.className='mod';
  const ls=lessons.filter(l=>l.mi===mi),dn=ls.reduce((a,l)=>a+cnt(l)[0],0),tt=ls.reduce((a,l)=>a+cnt(l)[2],0);
  d.innerHTML=`<button type="button" aria-expanded="${mi===openM}">${mi===openM?'▾':'▸'} ${c.m}<small>выполнено ${dn} из ${tt}</small></button><ul></ul>`;
  const ul=d.querySelector('ul');
  lessons.forEach((l,i)=>{if(l.mi!==mi)return;const li=document.createElement('li');
   const n=cnt(l)[0];
   li.innerHTML=`<button type="button" class="${i===cur?'on':''}">${l.t}<small>выполнено ${n} из ${cnt(l)[2]}</small></button>`;
   li.firstChild.onclick=()=>{cur=i;st=0;draw()};ul.appendChild(li)});
  d.firstChild.onclick=()=>{openM=openM===mi?-1:mi;drawNav()};ul.style.display=mi===openM?'':'none';
  nav.appendChild(d)});const A=lessons.reduce((a,l)=>{const c=cnt(l);return[a[0]+c[0],a[1]+c[1],a[2]+c[2]]},[0,0,0]);document.querySelector('.note').textContent='Курс: 4 модуля, '+lessons.length+' уроков. Выполнено '+A[0]+' из '+A[2]+' заданий'}
function draw(){
 openM=lessons[cur].mi;drawNav();
 const L=lessons[cur],S=L.s[st];
 const GN=['Теория','Разбор задачи','Тренажёр · уровень 1','Тренажёр · уровень 2','Самостоятельная работа'];

  h+='</div></div>'});
 h+=`<div class="card" style="margin-top:14px"><span class="tag">${S.tag}</span>`;
 if(S.type==='text')h+=S.html;
 if(S.type==='ph')h+='<div class="ph">Здесь будут теория, разбор и задачи трёх уровней. Структура урока та же: теория, разбор, тренажёр, самопроверка.</div>';
 if(S.type==='quiz'){h+=`<p><b>${S.q}</b></p><div id="gr"></div>`;S.opts.forEach((o,i)=>h+=`<button type="button" class="opt" data-o="${i}">${o}</button>`);h+=`<button type="button" class="btn" id="chk">Отправить</button> <button type="button" class="btn sec" id="sol" ${S.self?'hidden':''}>Показать решение</button>`}
 if(S.type==='num'){h+=`<p><b>${S.q}</b></p><div id="gr"></div><input type="text" id="inp" inputmode="decimal" aria-label="Ответ"> <button type="button" class="btn" id="chk">Отправить</button> <button type="button" class="btn sec" id="sol" ${S.self?'hidden':''}>Показать решение</button>`}
 h+=`<div class="fb" id="fb" role="status"></div></div><div class="nav2"><button type="button" class="btn sec" id="pv" ${st===0?'disabled':''}>Назад</button><button type="button" class="btn sec" id="nx" ${st===L.s.length-1&&cur===lessons.length-1?'disabled':''}>${st===L.s.length-1?'Следующий урок':'Дальше'}</button></div>`;
 main.innerHTML=h;main.insertAdjacentHTML('beforeend','<div id="rb"></div>');
 main.querySelectorAll('.steps button').forEach(b=>b.onclick=()=>{st=+b.dataset.i;draw()});
 document.getElementById('pv').onclick=()=>{st--;draw()};
 document.getElementById('nx').onclick=()=>{if(st<L.s.length-1)st++;else if(cur<lessons.length-1){cur++;st=0}draw();scrollTo(0,0)};
 if(S.type==='text')L.done[st]=L.done[st]||1;
 const fb=document.getElementById('fb');const sol=document.getElementById('sol');if(sol)sol.hidden=true;
 const val=L.val||(L.val=[]),corr=L.corr||(L.corr=[]),rb=document.getElementById('rb'),chk=document.getElementById('chk');
 const SF=x=>x.tag.startsWith('Самостоятельная'),sf=SF(S),selfI=L.s.map((x,k)=>SF(x)?k:-1).filter(k=>k>=0);
 const opts=()=>main.querySelectorAll('.opt'),btn=()=>main.querySelectorAll('.steps button')[st];
 const verdict=ok=>{fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=(ok?'Верно. ':'Неверно. ')+S.why};
 if(sol){sol.hidden=true;sol.onclick=()=>{fb.className='fb info';fb.textContent='Решение: '+S.why}}
 function result(){if(!L.fin){rb.innerHTML='';return}
  const a=selfI.filter(k=>corr[k]).length,t=selfI.length,p=Math.round(100*a/t);
  rb.innerHTML=`<div class="card" style="margin-top:16px"><b>Итог самостоятельной работы: ${p}%</b><p>Верно решено ${a} из ${t} заданий. ${p>=80?'Отличный результат.':p>=60?'Хороший результат: откройте задания, отмеченные красным, и разберите решения.':'Повторите теорию и пройдите урок ещё раз.'} Теперь в самостоятельных заданиях видны верные и неверные ответы с решениями.</p><button type="button" class="btn sec" id="rs">Пройти заново</button></div>`;
  document.getElementById('rs').onclick=()=>{L.done=L.s.map(()=>0);L.val=[];L.corr=[];L.att=[];L.wr=[];L.fin=false;st=0;draw()}}
 function lock(){opts().forEach(o=>o.disabled=true);const e=document.getElementById('inp');if(e)e.disabled=true;if(chk)chk.hidden=true}
 function commit(ans,ok){
  val[st]=ans;
  if(sf){L.done[st]=3;corr[st]=ok;lock();
   if(selfI.every(k=>L.done[k]===3)){L.fin=true;draw();return}
   fb.className='fb info';fb.textContent='Ответ сохранён, его нельзя изменить.';btn().className='on dn';drawNav();return}
  const A=L.att[st]||0;
  if(ok){L.done[st]=1;verdict(true);lock();btn().className='on ok'}
  else{L.att[st]=A+1;L.done[st]=2;(L.wr[st]=L.wr[st]||[]).push(ans);btn().className='on bad';
   if(A>=1){verdict(false);lock()}
   else{fb.className='fb bad';fb.textContent='Неверно. У вас осталась одна попытка.';if(S.type==='quiz')opts().forEach(o=>{if(+o.dataset.o===ans)o.disabled=true})}}
  if(sol)sol.hidden=true;
  paintG();drawNav()}
 if(S.type==='quiz'){chk.hidden=true;
  opts().forEach(o=>o.onclick=()=>{if(sf?L.done[st]:(L.done[st]===1||(L.att[st]||0)>=2))return;const i=+o.dataset.o;
   o.classList.add(sf?'sel':(i===S.ok?'right':'wrong'));
   commit(i,i===S.ok)})}
 if(S.type==='num'){const inp=document.getElementById('inp');
  const go=()=>{if(sf?L.done[st]:(L.done[st]===1||(L.att[st]||0)>=2))return;const v=inp.value.trim().replace(',','.').replace('−','-').replace(/\s/g,'');
   if(!v||isNaN(pf(v))){fb.className='fb bad';fb.textContent='Введите число.';return}
   commit(inp.value,Math.abs(pf(v)-pf(S.ans))<1e-6)};
  chk.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}}
 if(L.done[st]&&(S.type==='quiz'||S.type==='num')){
  if(S.type==='num')document.getElementById('inp').value=val[st]||'';
  if(sf){
   if(S.type==='quiz')opts().forEach((x,k)=>{if(L.fin){if(k===S.ok)x.classList.add('right');else if(k===val[st])x.classList.add('wrong')}else if(k===val[st])x.classList.add('sel')});
   lock();
   if(L.fin)verdict(corr[st]);else{fb.className='fb info';fb.textContent='Ответ сохранён, его нельзя изменить.'}}
  else{const A=L.att[st]||0,d1=L.done[st]===1;
   if(S.type==='quiz')opts().forEach((x,k)=>{if(d1&&k===val[st])x.classList.add('right');else if((L.wr[st]||[]).includes(k)){x.classList.add('wrong');if(!d1&&A<2)x.disabled=true}});
   if(d1||A>=2){verdict(d1);lock()}else{fb.className='fb bad';fb.textContent='Неверно. У вас осталась одна попытка.'}}}
 const gd=document.getElementById('gr');function paintG(){if(!gd||!S.g)return;const fin=sf?!!L.fin:(L.done[st]===1||(L.att[st]||0)>=2);gd.innerHTML=graphSVG(S.g,fin)}

 result();
}
